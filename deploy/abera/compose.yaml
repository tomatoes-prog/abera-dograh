# One tenant runtime. Pin DOGRAH_API_IMAGE and DOGRAH_UI_IMAGE to ECR digests.
# The control plane runs migrate and provision as one-shot operations before
# exposing gateway; "up" alone is not a provisioning or upgrade procedure.
x-api-env: &api-env
  DEPLOYMENT_MODE: abera
  AUTH_PROVIDER: local
  ENABLE_SIGNUP: "false"
  ENABLE_AWS_S3: "true"
  ENABLE_TELEMETRY: "false"
  ENABLE_DOGRAH_MPS: "false"
  ABERA_SUBSCRIPTION_ID: ${ABERA_SUBSCRIPTION_ID:?}
  ABERA_PLAN: ${ABERA_PLAN:?}
  ABERA_DB_POOL_SIZE: "2"
  ABERA_MAX_AGENTS: ${ABERA_MAX_AGENTS:?}
  ABERA_MAX_CONCURRENT_CALLS: ${ABERA_MAX_CONCURRENT_CALLS:?}
  ABERA_STORAGE_LIMIT_BYTES: ${ABERA_STORAGE_LIMIT_BYTES:?}
  ABERA_MANAGED_NOVA_ENABLED: ${ABERA_MANAGED_NOVA_ENABLED:-false}
  ABERA_BILLING_API_URL: ${ABERA_BILLING_API_URL:-}
  ABERA_BILLING_REGION: ${ABERA_BILLING_REGION:-us-east-2}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
  UI_APP_URL: ${PUBLIC_BASE_URL:?}
  PUBLIC_HOST: ${PUBLIC_HOST:?}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_BASE_URL:?}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?}
  S3_BUCKET: ${S3_BUCKET:?}
  S3_REGION: ${S3_REGION:?}
  LOG_TO_FILE: "false"

x-api-common: &api-common
  image: ${DOGRAH_API_IMAGE:?}
  env_file:
    - ${ABERA_RUNTIME_ENV:?}
  environment: *api-env
  restart: unless-stopped
  networks: [tenant]

services:
  valkey:
    image: ${VALKEY_IMAGE:?}
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes:
      - /var/lib/abera/redis:/data
    restart: unless-stopped
    networks: [tenant]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      retries: 5

  migrate:
    <<: *api-common
    command: ["./scripts/run_migrate.sh"]
    restart: "no"

  provision:
    <<: *api-common
    env_file:
      - ${ABERA_RUNTIME_ENV:?}
      - ${ABERA_PROVISION_ENV:?}
    command: ["python", "-m", "api.services.abera.provision_admin"]
    restart: "no"

  api:
    <<: *api-common
    command: ["./scripts/run_web.sh"]
    depends_on:
      valkey:
        condition: service_healthy
    expose: ["8000"]

  worker:
    <<: *api-common
    command: ["./scripts/run_arq_worker.sh"]
    depends_on:
      valkey:
        condition: service_healthy

  orchestrator:
    <<: *api-common
    command: ["./scripts/run_campaign_orchestrator.sh"]
    depends_on:
      valkey:
        condition: service_healthy

  ari:
    <<: *api-common
    profiles: ["ari"]
    command: ["./scripts/run_ari_manager.sh"]
    depends_on:
      valkey:
        condition: service_healthy

  ui:
    image: ${DOGRAH_UI_IMAGE:?}
    environment:
      BACKEND_URL: http://api:8000
    restart: unless-stopped
    networks: [tenant]
    expose: ["3010"]

  gateway:
    image: ${NGINX_IMAGE:?}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on: [api, ui]
    restart: unless-stopped
    networks: [tenant]

networks:
  tenant: {}
